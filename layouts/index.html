<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsung Network | Meaningful Work in AI</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                    animation: {
                        'fade-in-up': 'fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards',
                        'bg-pan': 'bgPan 15s ease infinite',
                    },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: 0, transform: 'translateY(20px)' },
                            '100%': { opacity: 1, transform: 'translateY(0)' },
                        },
                        bgPan: {
                            '0%, 100%': { backgroundPosition: '0% 50%' },
                            '50%': { backgroundPosition: '100% 50%' },
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .animate-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #111827, #020617);
            background-size: 400% 400%;
        }
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
        details[open] summary ~ * { animation: fadeInUp 0.4s ease-out; }
    </style>
</head>
<body class="min-h-screen animate-bg flex flex-col items-center justify-center p-4 sm:p-6 text-slate-100 relative overflow-x-hidden">
    
    <!-- Main Glassmorphism Container -->
    <main class="max-w-3xl w-full mx-auto space-y-10 backdrop-blur-md bg-slate-900/50 p-8 sm:p-14 rounded-[2.5rem] border border-slate-700/60 shadow-2xl relative z-10 animate-fade-in-up">
        
        <!-- Brand Header -->
        <header class="space-y-8 text-center">
            <div class="relative inline-block">
                <div class="absolute inset-0 bg-blue-500 rounded-full blur-xl opacity-20"></div>
                <img src="/images/logo.png" alt="Unsung Network Logo" class="relative w-32 h-32 mx-auto rounded-full shadow-2xl border border-slate-600/50 bg-slate-800 object-cover" onerror="this.style.display='none'">
            </div>
            
            <div class="space-y-4">
                <h1 class="text-4xl sm:text-5xl md:text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-400">
                    Unsung Network
                </h1>
                <p class="text-lg sm:text-xl text-slate-300 font-medium max-w-xl mx-auto leading-relaxed">
                    Helping you find meaningful work in the changing world of AI.
                </p>
            </div>
            
            <div class="inline-flex items-center gap-2 bg-slate-800/80 text-slate-300 px-6 py-2.5 rounded-full font-mono text-sm border border-slate-700/80 shadow-inner hover:bg-slate-700/80 transition-colors">
                <i class="fa-solid fa-at text-slate-500"></i>
                <span class="text-white font-bold tracking-wide">unsungnetwork</span>
            </div>
        </header>
        
        <!-- Primary Focus: YouTube & Instagram -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4 max-w-lg mx-auto w-full">
            <a href="https://www.youtube.com/@unsungnetwork" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-center gap-3 p-4 rounded-2xl bg-red-600/90 hover:bg-red-500 text-white font-bold transition-all duration-300 shadow-lg hover:shadow-red-500/40 hover:-translate-y-1 border border-red-500/20">
                <i class="fa-brands fa-youtube text-2xl group-hover:scale-110 transition-transform"></i>
                <span>Watch on YouTube</span>
            </a>
            <a href="https://www.instagram.com/unsungnetwork" target="_blank" rel="noopener noreferrer" class="group flex items-center justify-center gap-3 p-4 rounded-2xl bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-600 hover:opacity-90 text-white font-bold transition-all duration-300 shadow-lg hover:shadow-pink-500/40 hover:-translate-y-1 border border-pink-500/20">
                <i class="fa-brands fa-instagram text-2xl group-hover:scale-110 transition-transform"></i>
                <span>Follow on Instagram</span>
            </a>
        </section>

        <!-- Buried Secondary Platforms -->
        <section class="max-w-2xl mx-auto border-t border-slate-700/50 pt-8 mt-8">
            <details class="group">
                <summary class="cursor-pointer text-sm text-slate-400 hover:text-white transition-colors flex items-center justify-center gap-3 select-none">
                    <span class="font-bold tracking-widest uppercase text-xs">Explore all platforms</span>
                    <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center border border-slate-700 group-hover:bg-slate-700 transition-colors">
                        <i class="fa-solid fa-chevron-down group-open:rotate-180 transition-transform duration-300"></i>
                    </div>
                </summary>
                
                <div class="pt-8 grid grid-cols-2 sm:grid-cols-4 gap-4">
                    <a href="https://unsungnetwork.substack.com" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-orange-500 transition-all border border-transparent hover:border-orange-500/30">
                        <i class="fa-solid fa-bookmark text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">Substack</span>
                    </a>
                    <a href="https://www.linkedin.com/company/unsungnetwork" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-blue-500 transition-all border border-transparent hover:border-blue-500/30">
                        <i class="fa-brands fa-linkedin text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">LinkedIn</span>
                    </a>
                    <a href="https://x.com/unsungnetwork" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-white transition-all border border-transparent hover:border-slate-500/30">
                        <i class="fa-brands fa-x-twitter text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">X</span>
                    </a>
                    <a href="https://github.com/unsungnetwork" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-white transition-all border border-transparent hover:border-slate-500/30">
                        <i class="fa-brands fa-github text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">GitHub</span>
                    </a>
                    <a href="https://www.tiktok.com/@unsungnetwork" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-pink-400 transition-all border border-transparent hover:border-pink-500/30">
                        <i class="fa-brands fa-tiktok text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">TikTok</span>
                    </a>
                    <a href="https://www.threads.net/@unsungnetwork" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-white transition-all border border-transparent hover:border-slate-500/30">
                        <i class="fa-brands fa-threads text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">Threads</span>
                    </a>
                    <a href="https://www.reddit.com/r/unsungnetwork" target="_blank" class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-800/40 hover:bg-slate-800 hover:-translate-y-1 text-slate-400 hover:text-orange-600 transition-all border border-transparent hover:border-orange-500/30">
                        <i class="fa-brands fa-reddit text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">Reddit</span>
                    </a>
                    <div class="flex flex-col items-center gap-3 p-4 rounded-2xl bg-slate-900/50 text-slate-600 cursor-not-allowed border border-slate-800/50">
                        <i class="fa-brands fa-discord text-2xl"></i>
                        <span class="text-xs font-bold tracking-wide">Discord</span>
                    </div>
                </div>
            </details>
        </section>
    </main>
    
    <footer class="mt-8 text-slate-500 text-sm font-medium animate-fade-in-up" style="animation-delay: 0.2s;">
        &copy; 2026 Unsung Network. All rights reserved.
    </footer>
</body>
</html>
