<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsung Network | Meaningful Work in AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #0f172a; color: #f8fafc; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-8 text-center bg-slate-900">
    
    <div class="max-w-4xl mx-auto space-y-10">
        
        <!-- Header / Logo -->
        <div class="space-y-6">
            <!-- Place your high-res logo at static/images/logo.png -->
            <img src="/images/logo.png" alt="Unsung Network Logo" class="w-32 h-32 mx-auto rounded-full shadow-2xl border border-slate-700 bg-slate-800" onerror="this.style.display='none'">
            
            <h1 class="text-5xl md:text-6xl font-extrabold tracking-tight text-white">
                Unsung Network
            </h1>
            <p class="text-xl md:text-2xl text-slate-400 font-medium max-w-2xl mx-auto leading-relaxed">
                Helping you find meaningful work in the changing world of AI.
            </p>
        </div>
        
        <!-- Universal Handle -->
        <div class="inline-block bg-slate-800 text-slate-300 px-6 py-3 rounded-full font-mono text-sm md:text-base tracking-wide border border-slate-700 shadow-sm">
            Universal Handle: <span class="text-white font-bold">@unsungnetwork</span>
        </div>

        <!-- Social Links Grid -->
        <div class="pt-6">
            <p class="text-sm text-slate-500 uppercase tracking-widest mb-6 font-semibold">Connect & Subscribe</p>
            <div class="grid grid-cols-2 md:grid-cols-5 gap-4">
                <a href="https://unsungnetwork.substack.com" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-blue-600 hover:text-white border border-slate-700/50 hover:border-blue-500 transition-all shadow-sm">Substack</a>
                <a href="https://www.youtube.com/@unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-red-600 hover:text-white border border-slate-700/50 hover:border-red-500 transition-all shadow-sm">YouTube</a>
                <a href="https://www.linkedin.com/company/unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-blue-700 hover:text-white border border-slate-700/50 hover:border-blue-600 transition-all shadow-sm">LinkedIn</a>
                <a href="https://x.com/unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-slate-700 hover:text-white border border-slate-700/50 hover:border-slate-500 transition-all shadow-sm">X (Twitter)</a>
                <a href="https://github.com/unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-slate-700 hover:text-white border border-slate-700/50 hover:border-slate-500 transition-all shadow-sm">GitHub</a>
                <a href="https://www.instagram.com/unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-pink-600 hover:text-white border border-slate-700/50 hover:border-pink-500 transition-all shadow-sm">Instagram</a>
                <a href="https://www.tiktok.com/@unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-slate-700 hover:text-white border border-slate-700/50 hover:border-slate-500 transition-all shadow-sm">TikTok</a>
                <a href="https://www.threads.net/@unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-slate-700 hover:text-white border border-slate-700/50 hover:border-slate-500 transition-all shadow-sm">Threads</a>
                <a href="https://www.reddit.com/r/unsungnetwork" target="_blank" class="block p-4 rounded-xl bg-slate-800/50 hover:bg-orange-600 hover:text-white border border-slate-700/50 hover:border-orange-500 transition-all shadow-sm">Reddit</a>
                <div class="block p-4 rounded-xl bg-slate-900 border border-slate-800 text-slate-600 cursor-default shadow-inner" title="Search @unsungnetwork on Discord">Discord</div>
            </div>
        </div>

    </div>
</body>
</html>
