<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unsung Network | Meaningful Work in AI</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Slow animated gradient background */
        @keyframes bg-pan {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .animate-bg {
            background: linear-gradient(-45deg, #0f172a, #1e1b4b, #0f172a, #020617);
            background-size: 400% 400%;
            animation: bg-pan 15s ease infinite;
        }
        
        /* Clean up the native details marker for the accordion */
        details > summary { list-style: none; }
        details > summary::-webkit-details-marker { display: none; }
    </style>
</head>
<body class="min-h-screen animate-bg flex flex-col items-center justify-center p-6 text-center text-slate-100 font-sans">
    
    <!-- Main Glassmorphism Container -->
    <div class="max-w-3xl w-full mx-auto space-y-12 backdrop-blur-sm bg-slate-900/40 p-8 md:p-12 rounded-3xl border border-slate-700/50 shadow-2xl">
        
        <!-- Brand Header -->
        <div class="space-y-6">
            <img src="/images/logo.png" alt="Unsung Network Logo" class="w-32 h-32 mx-auto rounded-full shadow-lg border-2 border-slate-600/50 bg-slate-800" onerror="this.style.display='none'">
            
            <h1 class="text-4xl md:text-6xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-blue-400 to-purple-400">
                Unsung Network
            </h1>
            <p class="text-lg md:text-xl text-slate-300 font-medium max-w-xl mx-auto leading-relaxed">
                Helping you find meaningful work in the changing world of AI.
            </p>
            
            <div class="inline-block bg-slate-800/80 text-slate-300 px-5 py-2 rounded-full font-mono text-sm border border-slate-700/80 shadow-inner">
                Universal Handle: <span class="text-white font-bold">@unsungnetwork</span>
            </div>
        </div>
        
        <!-- Primary Focus: YouTube & Instagram -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4 max-w-lg mx-auto w-full">
            <a href="https://www.youtube.com/@unsungnetwork" target="_blank" class="flex items-center justify-center gap-3 p-4 rounded-2xl bg-red-600/90 hover:bg-red-500 text-white font-bold transition-all shadow-lg hover:shadow-red-500/25 border border-red-500/20">
                <i class="fa-brands fa-youtube text-2xl"></i>
                <span>Watch on YouTube</span>
            </a>
            <a href="https://www.instagram.com/unsungnetwork" target="_blank" class="flex items-center justify-center gap-3 p-4 rounded-2xl bg-gradient-to-tr from-yellow-500 via-pink-500 to-purple-600 hover:opacity-90 text-white font-bold transition-all shadow-lg hover:shadow-pink-500/25 border border-pink-500/20">
                <i class="fa-brands fa-instagram text-2xl"></i>
                <span>Follow on Instagram</span>
            </a>
        </div>

        <!-- Buried Secondary Platforms -->
        <details class="group max-w-2xl mx-auto">
            <summary class="cursor-pointer text-sm text-slate-400 hover:text-white transition-colors flex items-center justify-center gap-2">
                <span class="font-semibold tracking-wide uppercase">Explore all platforms</span>
                <i class="fa-solid fa-chevron-down group-open:rotate-180 transition-transform"></i>
            </summary>
            
            <!-- Grid appears when details is open -->
            <div class="pt-8 grid grid-cols-3 sm:grid-cols-4 gap-4 animate-fade-in">
                <a href="https://unsungnetwork.substack.com" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-orange-500 transition-colors">
                    <i class="fa-solid fa-bookmark text-2xl"></i>
                    <span class="text-xs font-medium">Substack</span>
                </a>
                <a href="https://www.linkedin.com/company/unsungnetwork" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-blue-500 transition-colors">
                    <i class="fa-brands fa-linkedin text-2xl"></i>
                    <span class="text-xs font-medium">LinkedIn</span>
                </a>
                <a href="https://x.com/unsungnetwork" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-white transition-colors">
                    <i class="fa-brands fa-x-twitter text-2xl"></i>
                    <span class="text-xs font-medium">X</span>
                </a>
                <a href="https://github.com/unsungnetwork" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-white transition-colors">
                    <i class="fa-brands fa-github text-2xl"></i>
                    <span class="text-xs font-medium">GitHub</span>
                </a>
                <a href="https://www.tiktok.com/@unsungnetwork" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-pink-400 transition-colors">
                    <i class="fa-brands fa-tiktok text-2xl"></i>
                    <span class="text-xs font-medium">TikTok</span>
                </a>
                <a href="https://www.threads.net/@unsungnetwork" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-white transition-colors">
                    <i class="fa-brands fa-threads text-2xl"></i>
                    <span class="text-xs font-medium">Threads</span>
                </a>
                <a href="https://www.reddit.com/r/unsungnetwork" target="_blank" class="flex flex-col items-center gap-2 p-3 rounded-xl hover:bg-slate-800/80 text-slate-400 hover:text-orange-600 transition-colors">
                    <i class="fa-brands fa-reddit text-2xl"></i>
                    <span class="text-xs font-medium">Reddit</span>
                </a>
                <div class="flex flex-col items-center gap-2 p-3 rounded-xl text-slate-600 cursor-not-allowed">
                    <i class="fa-brands fa-discord text-2xl"></i>
                    <span class="text-xs font-medium">Discord</span>
                </div>
            </div>
        </details>
        
    </div>
</body>
</html>
